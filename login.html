<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attix</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-container {
            min-height: 100vh;
        }

        .auth-image {
            background: linear-gradient(rgba(10, 17, 30, 0.7), rgba(10, 17, 30, 0.9)), url('https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
        }

        .auth-form-wrapper {
            max-width: 450px;
            width: 100%;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        @media (max-width: 991px) {
            .auth-image {
                display: none;
            }

            .auth-main-col {
                padding-top: 5rem !important;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid p-0">
        <div class="top-controls">
            <button class="btn btn-outline-custom btn-sm d-flex align-items-center justify-content-center nav-toggle-btn" id="theme-toggle" title="Toggle Theme">
                <i class="bi bi-moon-stars"></i>
            </button>
            <button class="btn btn-outline-custom btn-sm d-flex align-items-center justify-content-center nav-toggle-btn" id="rtl-toggle" title="RTL">
                RTL
            </button>
        </div>
        <div class="row g-0 auth-container">

            <!-- Main Form Column -->
            <div class="col-12 d-flex flex-column align-items-center justify-content-center p-5 auth-main-col">


                <div class="auth-form-wrapper">
                    <div class="glass-card p-5">
                        <div class="text-center mb-4">
                            <a href="index.html"
                                class="navbar-brand d-flex align-items-center justify-content-center mb-3">
                                <img src="assets/images/logo.svg" alt="Attix Logo" height="35" class="me-2" style="width: 35px;">
                                <span class="fw-bold text-white fs-4">Att<span class="text-gradient">ix</span></span>
                            </a>
                        </div>
                        <h2 class="h4 mb-2 text-center">Welcome Back</h2>
                        <p class="text-secondary text-sm text-center mb-5">Sign in to view inspection reports and project schedules.</p>

                        <form>
                            <div class="mb-4">
                                <label class="form-label text-secondary text-sm">Email Address</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-color text-secondary border-end-0"><i
                                            class="bi bi-envelope"></i></span>
                                    <input type="email"
                                        class="form-control bg-transparent border-color text-white shadow-none border-start-0"
                                        placeholder="name@example.com">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary text-sm">Password</label>
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-transparent border-color text-secondary border-end-0"><i
                                            class="bi bi-lock"></i></span>
                                    <input type="password"
                                        class="form-control bg-transparent border-color text-white shadow-none border-start-0 border-end-0"
                                        placeholder="Enter your password" id="password">
                                    <span
                                        class="input-group-text bg-transparent border-color text-secondary border-start-0 cursor-pointer toggle-password"
                                        style="cursor: pointer;">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4 login-aux-row">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input bg-transparent border-color"
                                        id="remember">
                                    <label class="form-check-label text-secondary text-sm remember-30-label" for="remember">Remember Me</label>
                                </div>
                                <a href="#" class="text-primary-accent text-sm text-decoration-none forgot-password-link">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4">Sign In</button>

                            <div class="text-center my-4">
                                <div class="d-flex align-items-center">
                                    <hr class="flex-grow-1 border-color">
                                    <span class="px-3 text-secondary text-xs auth-continue-text">OR CONTINUE WITH</span>
                                    <hr class="flex-grow-1 border-color">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-4">
                                    <button type="button" class="btn btn-outline-custom w-100 py-2" title="Google"><i
                                             class="bi bi-google"></i></button>
                                </div>
                                <div class="col-4">
                                    <button type="button" class="btn btn-outline-custom w-100 py-2" title="Facebook"><i
                                             class="bi bi-facebook"></i></button>
                                </div>
                                <div class="col-4">
                                    <button type="button" class="btn btn-outline-custom w-100 py-2" title="Apple"><i
                                             class="bi bi-apple"></i></button>
                                </div>
                            </div>

                            <div class="text-center">
                                <p class="text-secondary text-sm">Need to book an assessment? <a href="contact.html"
                                        class="text-primary-accent text-decoration-none fw-bold">Book Free Inspection</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
